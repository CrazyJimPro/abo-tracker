name: Windows-Installer bauen

# Baut installscript/windows/setup.iss zu AboTrackerSetup.exe. windows-latest
# bringt Inno Setup bereits mit (siehe actions/runner-images) — ein
# Choco-Fallback greift nur, falls sich das mal ändert.
#
# - Push eines v*-Tags: baut UND hängt die .exe als Asset an das zugehörige
#   GitHub Release an (existiert das Release schon, wird nur das Asset
#   ergänzt).
# - workflow_dispatch: baut nur, Ergebnis als Artifact zum Herunterladen —
#   praktisch für einen Testlauf auf einer VM ohne gleich ein Release zu
#   berühren.

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inno Setup compilieren
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }

          # Die Version kommt aus dem gepushten Tag, sonst aus package.json.
          # Ohne das trug jede gebaute .exe die in setup.iss von Hand
          # gepflegte Nummer, unabhängig davon, welches Release gerade
          # gebaut wurde.
          $pkgVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $version = "${{ github.ref_name }}" -replace '^v', ''

          if ($version -notmatch '^\d+(\.\d+)*$') {
            # Kein Versions-Tag (workflow_dispatch) — dann gilt package.json.
            $version = $pkgVersion
          } elseif ($version -ne $pkgVersion) {
            # Es gibt zwei Versionsnummern, und sie müssen übereinstimmen: der
            # Tag bestimmt, was der Installer in "Apps & Features" einträgt,
            # package.json bestimmt, was die App selbst anzeigt (lib/version.ts
            # liest CURRENT_VERSION von dort). Liefen sie auseinander, meldete
            # sich eine frisch installierte neueste Version mit der alten
            # Nummer — und UpdateBadge verglich sie mit dem neuesten Release
            # und zeigte dauerhaft ein "Update verfügbar" an, das sich nie
            # erledigen ließ. Genau so passiert zwischen v1.6.6 und v1.6.7.
            throw "Tag v$version und package.json ($pkgVersion) stimmen nicht ueberein. Vor dem Taggen die Version in package.json setzen (und die Vorgabe in installscript/windows/setup.iss gleich mit)."
          }
          Write-Host "Installer-Version: $version (package.json: $pkgVersion)"

          & $iscc "/DMyAppVersion=$version" "installscript\windows\setup.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC fehlgeschlagen." }

      - uses: actions/upload-artifact@v4
        with:
          name: AboTrackerSetup
          path: installscript/windows/dist/AboTrackerSetup.exe

      - name: An GitHub Release anhängen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: installscript/windows/dist/AboTrackerSetup.exe
